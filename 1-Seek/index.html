<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seek — cible autonome et paramètres de pilotage</title>
    <link rel="stylesheet" href="style.css">
    <script src="libraries/p5.min.js"></script>
    <script src="vehicle.js"></script>
    <script src="population.js"></script>
    <script src="settings.js"></script>
    <script src="flee.js"></script>
    <script src="ship.js"></script>
    <script src="fleeControls.js"></script>
    <script src="background.js"></script>
    <script src="targetAcceleration.js"></script>
    <script src="target.js"></script>
    <script src="sketch.js"></script>
  </head>
  <body>
    <header id="controls">
      <label for="vehicle-count">Vaisseaux :</label>
      <input id="vehicle-count" type="range" min="1" max="200" step="1" value="20">
      <output id="vehicle-count-value" for="vehicle-count">20 / 200</output>
      <label for="target-count">Cibles Flee :</label>
      <input id="target-count" type="range" min="1" max="20" step="1" value="1">
      <output id="target-count-value" for="target-count">1 / 20</output>
      <label for="detection-radius">Rayon de détection :</label>
      <input id="detection-radius" type="range" min="0" max="300" step="1" value="300">
      <output id="detection-radius-value" for="detection-radius">300 px</output>
      <label for="max-speed">Vitesse max :</label>
      <input id="max-speed" type="range" min="0" max="20" step="0.1" value="14">
      <output id="max-speed-value" for="max-speed">14</output>
      <label for="max-force">Force max :</label>
      <input id="max-force" type="range" min="0" max="10" step="0.1" value="0.6">
      <output id="max-force-value" for="max-force">0.6</output>
      <label for="behavior-mode">Comportement :</label>
      <select id="behavior-mode">
        <option value="seek">Seek — suivre</option>
        <option value="flee" selected>Flee</option>
        <option value="flee-many">Flee — plusieurs cibles</option>
      </select>
      <span id="behavior-hint" class="hint">Les véhicules suivent la cible autonome rouge.</span>
    </header>
    <main id="scene" aria-label="Simulation de véhicules poursuivant une cible"></main>
  </body>
</html>
